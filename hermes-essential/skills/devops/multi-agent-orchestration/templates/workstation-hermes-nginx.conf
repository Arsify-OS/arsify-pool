# Workstation Upshalter Nginx Configuration
# Path-based Hermes ecosystem under /hermes/
# Usage: cp this file to /etc/nginx/sites-available/workstation-upshalter

server {
    server_name workstation.upshalter.com;

    access_log /var/log/nginx/workstation-access.log;
    error_log /var/log/nginx/workstation-error.log;

    # =========================================================================
    # 1. MAIN DASHBOARD: /hermes/
    # =========================================================================
    location /hermes/ {
        alias /var/www/workstation/hermes/;
        try_files $uri $uri/ /hermes/index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # 2. WORKSPACE PROXY: /hermes/workspace/
    # =========================================================================
    location /hermes/workspace/ {
        rewrite ^/hermes/workspace(/.*)$ $1 break;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # =========================================================================
    # 3. KANBAN PROXY: /hermes/kanban/
    # =========================================================================
    location /hermes/kanban/ {
        rewrite ^/hermes/kanban(/.*)$ $1 break;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # =========================================================================
    # 4. ORCHESTRATOR API PROXY: /hermes/api/
    # CRITICAL: API key injected by Nginx (not exposed to browser)
    # =========================================================================
    location /hermes/api/ {
        rewrite ^/hermes/api(/.*)$ $1 break;
        
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # API key injection - NEVER expose in client-side JS
        proxy_set_header X-API-Key "hma_kUjTtoP_NUBD9EAxlpIjedkc7aNnKYZ1XbgN4_vAjf0";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # =========================================================================
    # 5. WEBSOCKET PROXY: /hermes/ws
    # =========================================================================
    location /hermes/ws {
        rewrite ^/hermes/ws(.*)$ /ws$1 break;
        
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # =========================================================================
    # 6. HEALTH CHECK
    # =========================================================================
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # SSL Configuration (managed by Certbot)
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/workstation.upshalter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workstation.upshalter.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirect HTTP to HTTPS
server {
    if ($host = workstation.upshalter.com) {
        return 301 https://$host$request_uri;
    }
    
    listen 80;
    server_name workstation.upshalter.com;
    return 404;
}
