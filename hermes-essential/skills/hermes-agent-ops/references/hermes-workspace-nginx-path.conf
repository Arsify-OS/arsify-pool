# Hermes Workspace Path-Based Nginx Config for /workspace
# Save to /tmp/hermes-workspace-nginx.conf then deploy to /etc/nginx/sites-available/

server {
    listen 80;
    server_name hermes.upshalter.com;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Path-based setup for /workspace
    location /workspace/ {
        # Remove /workspace prefix before proxying
        rewrite ^/workspace(/.*)$ $1 break;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # WebSocket support
        proxy_read_timeout 86400;
    }
    
    # Redirect root to /workspace
    location = / {
        return 301 /workspace/;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
